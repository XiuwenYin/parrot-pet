# 打 v 开头的标签（如 v0.1.0）时，自动打 Windows 和 Mac 安装包并发布到 Releases
name: 打包发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --registry=https://registry.npmjs.org
      - name: 编译 Mac 小工具（找鸟、抽帧、窗口位置）
        if: runner.os == 'macOS'
        run: zsh tools/build_helpers.sh
      - name: 停掉 XProtect（GitHub 的 Mac 机器上它会占着新做的 dmg，导致卸载失败）
        if: runner.os == 'macOS'
        run: |
          sudo pkill -9 XProtect >/dev/null || true
          while pgrep XProtect; do sleep 3; done
      - name: 打包
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/* \
            --repo "${{ github.repository }}" \
            --title "鹦鹉桌宠 ${{ github.ref_name }}" \
            --notes "下载说明：
          - **Mac（M1/M2/M3/M4 等 Apple 芯片）**：ParrotPet-*-mac-arm64.dmg
          - **Mac（Intel 芯片）**：ParrotPet-*-mac-x64.dmg
          - **Windows**：ParrotPet-*-win-x64.exe

          第一次打开：
          - Mac：安装包没有苹果开发者签名。打开时如果提示"无法验证开发者"或"已损坏"，到 系统设置 → 隐私与安全性，点"仍要打开"；或者在终端运行 \`xattr -cr /Applications/鹦鹉桌宠.app\` 后再打开。
          - Windows：如果出现"Windows 已保护你的电脑"，点"更多信息" → "仍要运行"。

          Windows 版暂不支持：啃桌面图标、视频/照片自动抠图（这两项用到了 macOS 的系统能力）。"
