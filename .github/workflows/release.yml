# 打 v 开头的标签（如 v0.1.0）时，自动打 Windows 和 Mac 安装包并发布到 Releases
name: 打包发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --registry=https://registry.npmjs.org
      - name: 编译 Mac 小工具（找鸟、抽帧、窗口位置）
        if: runner.os == 'macOS'
        run: zsh tools/build_helpers.sh
      - name: 打包（Windows）
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
      # GitHub 的 Mac 机器上 XProtect / Spotlight 常会占着刚做好的 dmg，导致卸载失败。
      # 先关掉它们再打 dmg；还不行就退回打 zip（解压后把 App 拖进"应用程序"即可）。
      - name: 打包（Mac）
        if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off >/dev/null 2>&1 || true
          sudo pkill -9 XProtect >/dev/null 2>&1 || true
          npx electron-builder --mac --publish never || {
            echo "dmg 打包失败，改打 zip"
            rm -f dist/*.dmg
            npx electron-builder --mac zip --publish never
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/* \
            --repo "${{ github.repository }}" \
            --title "鹦鹉桌宠 ${{ github.ref_name }}" \
            --notes "下载说明：
          - **Mac（M1/M2/M3/M4 等 Apple 芯片）**：ParrotPet-*-mac-arm64（.dmg 或 .zip）
          - **Mac（Intel 芯片）**：ParrotPet-*-mac-x64（.dmg 或 .zip）
          - .zip 版：双击解压，把"鹦鹉桌宠"拖进"应用程序"文件夹
          - **Windows**：ParrotPet-*-win-x64.exe

          第一次打开：
          - Mac：安装包没有苹果开发者签名。打开时如果提示"无法验证开发者"或"已损坏"，到 系统设置 → 隐私与安全性，点"仍要打开"；或者在终端运行 \`xattr -cr /Applications/鹦鹉桌宠.app\` 后再打开。
          - Windows：如果出现"Windows 已保护你的电脑"，点"更多信息" → "仍要运行"。

          Windows 版暂不支持：啃桌面图标、视频/照片自动抠图（这两项用到了 macOS 的系统能力）。"
