<!doctype html><html><head><meta charset="utf-8"><title>虎皮部件原型</title>
<style>body{margin:0;background:#f4f1ea;font:14px -apple-system,"PingFang SC"} svg{width:704px;height:384px;display:block} #lab{position:absolute;left:12px;top:8px;color:#666}</style></head>
<body><div id="lab"></div>
<svg viewBox="0 0 1408 768">
 <defs><filter id="nblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter><filter id="blur"><feGaussianBlur stdDeviation="3"/></filter></defs>
 <ellipse cx="880" cy="700" rx="200" ry="16" fill="#000" opacity=".08"/>
 <g id="pose">
  <g id="upper">
   <image id="legB" href="parts/p_1155_495.png" x="880" y="545" width="161" height="149"/>
   <image id="legF" href="parts/p_1155_495.png" x="800" y="548" width="161" height="149"/>
   <clipPath id="noStub"><path d="M0,0 H700 V280 C800,300 900,330 1000,365 L1160,365 V768 H0 Z"/></clipPath>
   <image id="body" href="parts/p_46_295.png" x="175" y="180" width="920" height="475" clip-path="url(#noStub)"/>
   <image id="bodyPuff" href="parts/puff.png" x="170" y="200" width="924" height="454" opacity="0"/>
   <defs><linearGradient id="padG" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgb(226,222,110)"/><stop offset="1" stop-color="rgb(170,204,105)"/></linearGradient>
     <filter id="padBlur" filterUnits="userSpaceOnUse" x="0" y="-300" width="1408" height="1400"><feGaussianBlur stdDeviation="14"/></filter></defs>
   <line id="pad" stroke="rgb(196,212,112)" stroke-width="190" stroke-linecap="round" filter="url(#padBlur)"/>
   <image id="neck" href="parts/neck.png" x="0" y="0" width="484" height="557"/>
   <g id="wing"><image href="parts/p_693_374.png" x="430" y="262" width="559" height="390"/></g>
   <g id="wingOpen" opacity="0"><image href="parts/wingopen.png" x="293" y="-3" width="696" height="359"/></g>
   <image id="bust" href="parts/bust.png" x="590" y="150" width="550" height="513" opacity="0"/>
   <g id="head">
     <g id="hSide"><image href="parts/p_774_62.png" x="896" y="96" width="340" height="320"/>
       <g id="jaw"><image href="parts/p_1199_262.png" x="1160" y="258" width="66" height="76"/></g>
       <g id="lid"><ellipse cx="1094" cy="202" rx="24" ry="23" fill="rgb(242,227,102)" filter="url(#blur)"/>
         <image href="parts/p_1132_99.png" x="1070" y="190" width="48" height="30"/></g></g>
     <image id="h34" href="parts/head34.png" x="905" y="96" width="323" height="346" opacity="0"/>
     <image id="hBack" href="parts/headback.png" x="897" y="96" width="338" height="339" opacity="0"/>
     <image id="hFront" href="parts/headfront.png" x="911" y="102" width="309" height="347" opacity="0"/>
   </g>
  </g>
 </g>
</svg>
<script src="../../src/catalog.js"></script><script src="../../src/actions.js"></script><script src="../../src/parrot.js"></script>
<script>
const K = 4, FEET = [880, 690], NECK = [1068, 383], SHOULDER = [950, 288], JAW = [1172, 268], HEADC = [1066, 256];
const $ = (id) => document.getElementById(id);
function apply(p) {
  $('pose').setAttribute('transform', `translate(0 ${p.y * K}) rotate(${p.rot} ${FEET[0]} ${FEET[1] - 50 * K}) translate(${FEET[0]} ${FEET[1]}) scale(${p.sx * p.puff} ${p.sy * p.puff}) translate(${-FEET[0]} ${-FEET[1]})`);
  const lift = 14 * K * Math.max(0, Math.min(1.5, p.legExt || 0));
  $('upper').setAttribute('transform', `translate(0 ${-lift})`);
  const flip = 1;   // 扭到背后用专门画的那张，不再镜像
  // 换角度：侧脸 → 3/4 侧脸 → 扭到背后，按 headFlip 交叉淡入；盯着你看时换正脸
  const sm = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
  let wSide = sm((p.headFlip - 0.35) / 0.5), wBack = sm((-p.headFlip - 0.35) / 0.5), w34 = Math.max(0, 1 - wSide - wBack), wFront = 0;
  if (p.front) { wFront = 1; wSide = w34 = wBack = 0; }
  // 扭到背后（理毛、睡觉）：整块"头+脖子+肩膀"换成一张连着画的上半身，头和身子不会断开
  const wb = sm((-p.headFlip - 0.2) / 0.5);
  $('bust').style.opacity = wb;
  $('head').style.opacity = 1 - wb; $('neck').style.opacity = (1 - wb) * (1 - wFront) * 0.85; $('pad').style.opacity = 1 - wb;
  $('hFront').setAttribute('transform', 'translate(0 26)');
  $('bust').setAttribute('transform', `translate(${(p.headX * K * 0.3).toFixed(1)} ${(p.headY * K * 0.3).toFixed(1)})`);
  $('hSide').style.opacity = wSide; $('h34').style.opacity = w34; $('hBack').style.opacity = wBack; $('hFront').style.opacity = wFront;
  // 翅膀张得大（飞、伸懒腰）就换成展开的翅膀；炸毛就换成鼓起来的身子
  const wo = sm((p.wing - 30) / 18);
  $('wing').style.opacity = (1 - wo) * (1 - wb); $('wingOpen').style.opacity = wo;
  $('wingOpen').setAttribute('transform', `rotate(${Math.max(-12, Math.min(12, (p.wing - 50) * 0.3)).toFixed(1)} ${SHOULDER[0]} ${SHOULDER[1]})`);
  const pf = sm((p.puff - 1.07) / 0.03);
  $('body').style.opacity = 1 - pf; $('bodyPuff').style.opacity = pf;
  $('head').setAttribute('transform', `translate(${p.headX * K} ${p.headY * K}) rotate(${p.headRot} ${NECK[0]} ${NECK[1]}) translate(${HEADC[0]} ${HEADC[1]}) scale(${flip * (p.headPuff || 1)} ${p.headPuff || 1}) translate(${-HEADC[0]} ${-HEADC[1]})`);
  // 脖子：一张带羽毛的图，下端钉在身子的脖子根（B），上端跟着头底下那一点（H）走：转过去、拉长都连着
  const r = p.headRot * Math.PI / 180, hx = p.headX * K, hy = p.headY * K;
  const H0 = [1035, 300], B = [965, 470];
  const vx0 = H0[0] - NECK[0], vy0 = H0[1] - NECK[1];
  const H = [NECK[0] + hx + vx0 * Math.cos(r) - vy0 * Math.sin(r), NECK[1] + hy + vx0 * Math.sin(r) + vy0 * Math.cos(r)];
  const dx = H[0] - B[0], dy = H[1] - B[1], len = Math.hypot(dx, dy);
  const ang = Math.atan2(dx, -dy) * 180 / Math.PI;          // 相对"竖直向上"转了多少
  const NB = [200, 520], NLEN = 440;                          // 图里脖子下端中点、上下长度
  // 软垫从肩膀中间连到头的中心偏下：头低下、伸长、转过来，中间都被同色的羽毛填满
  const HC = [NECK[0] + hx + (HEADC[0] - NECK[0]) * Math.cos(r) - (HEADC[1] + 50 - NECK[1]) * Math.sin(r), NECK[1] + hy + (HEADC[0] - NECK[0]) * Math.sin(r) + (HEADC[1] + 50 - NECK[1]) * Math.cos(r)];
  const pad = $('pad'); pad.setAttribute('x1', 975); pad.setAttribute('y1', 430); pad.setAttribute('x2', HC[0].toFixed(1)); pad.setAttribute('y2', HC[1].toFixed(1));
  $('neck').setAttribute('transform', `translate(${B[0]} ${B[1]}) rotate(${ang.toFixed(1)}) scale(0.42 ${(len / NLEN).toFixed(3)}) translate(${-NB[0]} ${-NB[1]})`);
  $('wing').setAttribute('transform', `rotate(${p.wing} ${SHOULDER[0]} ${SHOULDER[1]})`);
  $('jaw').setAttribute('transform', `rotate(${p.jaw} ${JAW[0]} ${JAW[1]})`);
  $('jaw').style.opacity = p.jaw > 2 ? 1 : 0;
  $('lid').style.opacity = p.eye < 0.4 || p.happyEyes ? 1 : 0;
  $('legF').setAttribute('transform', `translate(${(p.legLX || 0) * K} ${-(p.legL || 0) * K})`);
  $('legB').setAttribute('transform', `translate(${(p.legRX || 0) * K} ${-(p.legR || 0) * K})`);
}
const q = new URLSearchParams(location.search);
window.render = (act, t) => { const front = act.endsWith('!'); act = act.replace('!', ''); const p = basePose(); POSES[act](t, { seed: 0.3, front, lookTilt: front ? 30 : 0 }, p); if (front) p.front = true; apply(p); $('lab').textContent = act + ' ' + t.toFixed(2) + 's'; };
if (q.get('play')) { const acts = q.get('play').split(','); let i = 0, t0 = performance.now();
  (function loop(now) { const t = (now - t0) / 1000; if (t > 4) { i = (i + 1) % acts.length; t0 = now; } render(acts[i], t); requestAnimationFrame(loop); })(performance.now()); }
else render('idle', 1);
</script></body></html>
